[tool.black]
line-length = 88
target-version = ["py313"]
#exclude = '''
#/path/to/dir/.*
#'''

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-logging-schemas"
version = "0.1.0"
description = "Unified log schemas for IoT microservices (Django, FastAPI, Kafka)"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Iot Team Alpha" }
]
dependencies = [
    "pydantic>=2.0",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iot_logging = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/iot_logging --cov-report=term-missing"